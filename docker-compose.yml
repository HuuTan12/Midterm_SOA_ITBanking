services:
  postgres:
    image: postgres:16
    container_name: ibanking_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./auth-service
    restart: unless-stopped
    environment:
      PORT: 8001
      AUTH_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/account_db
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      NOTIFY_URL: http://notification-service:8004
      DEBUG_RETURN_OTP: ${DEBUG_RETURN_OTP:-0}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      notification-service:
        condition: service_started

  tuition-service:
    build: ./tuition-service
    restart: unless-stopped
    environment:
      PORT: 8002
      TUITION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/tuition_db
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    restart: unless-stopped
    environment:
      PORT: 8004
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    ports:
      - "8004:8004"

  payment-service:
    build: ./payment-service
    restart: unless-stopped
    environment:
      PORT: 8003
      PAYMENT_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/payment_db
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      ACCOUNT_URL: http://auth-service:8001
      TUITION_URL: http://tuition-service:8002
      NOTIFY_URL: http://notification-service:8004
      DEBUG_RETURN_OTP: ${DEBUG_RETURN_OTP:-0}
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      tuition-service:
        condition: service_started
      notification-service:
        condition: service_started

  frontend:
    build: ./frontend-tuition
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - payment-service

volumes:
  pgdata: